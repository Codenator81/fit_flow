site_name: FitFlow
site_description: Offline-first Flutter workout tracker on Firebase. Product spec, architecture and developer guide.
site_url: https://codenator81.github.io/fit_flow/
repo_url: https://github.com/Codenator81/fit_flow
repo_name: Codenator81/fit_flow
edit_uri: edit/master/docs/
copyright: FitFlow &middot; documentation built from the <code>docs/</code> folder of the repository

exclude_docs: |
  requirements.txt

# Copies the golden screenshots from test/goldens/screens/ into the site, so
# the docs always show the screens the tests currently verify.
hooks:
  - tool/mkdocs_hooks.py

theme:
  name: material
  logo: assets/logo.svg
  favicon: assets/logo.svg
  icon:
    repo: fontawesome/brands/github
  font:
    text: Roboto
    code: Roboto Mono
  palette:
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.top
    - navigation.footer
    - navigation.indexes
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link
    - content.action.edit
    - toc.follow

extra_css:
  - assets/stylesheets/extra.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Codenator81/fit_flow

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

nav:
  - Home: index.md
  - Product:
      - product/index.md
      - Screens: product/screens.md
      - Roadmap: product/roadmap.md
  - Architecture:
      - architecture/index.md
      - Data model: architecture/data-model.md
      - Firebase: architecture/firebase.md
      - Decisions (ADR): architecture/decisions.md
  - Development:
      - development/index.md
      - Testing: development/testing.md
      - CI & quality: development/ci.md
      - Contributing: development/contributing.md
  - Changelog: changelog.md
