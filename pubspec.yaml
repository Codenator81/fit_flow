name: fit_flow
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.14.0
  # Single source of truth for the Flutter version; CI reads it via
  # subosito/flutter-action (flutter-version-file: pubspec.yaml).
  flutter: 3.50.1

dependencies:
  cloud_firestore: ^7.2.0
  dartz: ^0.10.1
  dio: ^5.9.0
  firebase_auth: ^7.1.0
  firebase_core: ^5.2.0
  fl_chart: ^1.3.1
  flutter:
    sdk: flutter
  freezed_annotation: ^3.1.0
  google_sign_in: ^7.2.0
  flutter_animate: ^4.5.0
  flutter_bloc: ^9.1.1
  get_it: ^9.2.0
  go_router: ^18.1.4
  google_fonts: ^9.0.0
  intl: ^0.20.3
  json_annotation: ^4.12.0
  pretty_dio_logger: ^1.4.0
  vibration: ^3.2.1
  material_ui: ^1.11.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_driver:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.10.4
  freezed: ^4.0.2
  json_serializable: ^6.11.2

flutter:
  uses-material-design: true

  # Bundled Google Fonts: the app works offline on first launch and tests
  # (golden screenshots) render real typography without network access.
  assets:
    - google_fonts/
