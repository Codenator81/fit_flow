name: fit_flow
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.10.3
  # Single source of truth for the Flutter version; CI reads it via
  # subosito/flutter-action (flutter-version-file: pubspec.yaml).
  flutter: 3.47.7

dependencies:
  cloud_firestore: ^5.6.0
  dartz: ^0.10.1
  dio: ^5.9.0
  firebase_auth: ^5.3.5
  firebase_core: ^3.11.0
  fl_chart: ^0.70.2
  flutter:
    sdk: flutter
  freezed_annotation: ^3.1.0
  google_sign_in: ^6.2.2
  flutter_animate: ^4.5.0
  flutter_bloc: ^9.1.1
  get_it: ^9.2.0
  go_router: ^17.0.1
  google_fonts: ^6.2.1
  intl: ^0.20.2
  json_annotation: ^4.9.0
  pretty_dio_logger: ^1.4.0
  vibration: ^2.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.10.4
  freezed: ^3.2.3
  json_serializable: ^6.11.2

flutter:
  uses-material-design: true
