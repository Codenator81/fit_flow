name: Docs

# Builds the documentation site (MkDocs Material, mkdocs.yml) and publishes it
# to GitHub Pages on pushes to master. Pull requests only check that the site
# builds without warnings. Golden screenshots are part of the site, so their
# changes trigger it too.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - docs/**
      - mkdocs.yml
      - tool/mkdocs_hooks.py
      - test/goldens/screens/**
      - .github/workflows/docs.yml
  push:
    branches: [master]
    paths:
      - docs/**
      - mkdocs.yml
      - tool/mkdocs_hooks.py
      - test/goldens/screens/**
      - .github/workflows/docs.yml

concurrency:
  group: docs-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: build site
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: docs/requirements.txt
      - run: pip install -r docs/requirements.txt
      - run: mkdocs build --strict
      - uses: actions/upload-pages-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          path: site

  deploy:
    name: deploy to GitHub Pages
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
