name: CI

on:
  pull_request:
  push:
    branches: [master]

# A new push to the same PR cancels the run that is still in progress.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  format:
    name: format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: pubspec.yaml
          cache: true
      # pub get is required: the formatter picks its style from the package's
      # language version, which it reads from .dart_tool/package_config.json.
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed .

  analyze:
    name: analyze
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: pubspec.yaml
          cache: true
      - run: flutter pub get
      - run: flutter analyze --fatal-infos

  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: pubspec.yaml
          cache: true
      - run: flutter pub get
      - run: flutter test --coverage

      - name: Build coverage report
        run: |
          # Generated code (*.g.dart, *.freezed.dart) is excluded from the numbers.
          awk -F'[:,]' '
            /^SF:/ { file = substr($0, 4); skip = (file ~ /\.(g|freezed)\.dart$/) }
            /^LF:/ && !skip { order[++n] = file; lf[file] = $2; tf += $2 }
            /^LH:/ && !skip { lh[file] = $2; th += $2 }
            END {
              pct = tf ? 100 * th / tf : 0
              printf "<!-- coverage-report -->\n### Test coverage: %.1f%%\n\n", pct
              printf "%d of %d lines covered (generated code excluded).\n\n", th, tf
              print "<details><summary>Per file</summary>\n"
              print "| File | Lines | Covered |"
              print "|---|---:|---:|"
              for (i = 1; i <= n; i++) {
                f = order[i]
                printf "| `%s` | %d/%d | %.1f%% |\n", f, lh[f], lf[f], lf[f] ? 100 * lh[f] / lf[f] : 0
              }
              print "\n</details>"
            }' coverage/lcov.info > coverage/report.md
          cat coverage/report.md >> "$GITHUB_STEP_SUMMARY"

      # One comment per PR, updated in place on every push. Skipped for forks
      # and Dependabot, whose tokens cannot write comments.
      - name: Comment coverage on PR
        if: >-
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          github.actor != 'dependabot[bot]'
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('coverage/report.md', 'utf8');
            const marker = '<!-- coverage-report -->';
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const existing = comments.find(c => c.user.type === 'Bot' && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

      - uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/
          retention-days: 14

  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      # Caches Gradle dependencies and the wrapper between runs.
      - uses: gradle/actions/setup-gradle@v6
      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: pubspec.yaml
          cache: true
      - run: flutter pub get
      - run: flutter build apk --debug
      - uses: actions/upload-artifact@v7
        with:
          name: app-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14
          if-no-files-found: error
