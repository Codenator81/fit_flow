name: Emulator tests

# Runs the app on an Android emulator and captures screenshots. Too slow for
# every PR, so it runs on demand (Actions tab -> Emulator tests -> Run
# workflow), once a week to catch regressions, and on PRs that change the
# emulator setup itself.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/emulator.yml
      - integration_test/**
      - test_driver/**
  schedule:
    - cron: '0 6 * * 1' # Mondays 06:00 UTC

concurrency:
  group: emulator-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  API_LEVEL: 34
  TARGET: google_apis
  ARCH: x86_64
  # A real phone size; the emulator's default profile is far narrower than
  # any current device.
  PROFILE: pixel_6

jobs:
  integration:
    name: integration tests (API 34)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      # Hosted Linux runners support KVM, but /dev/kvm is not accessible to
      # the runner user until this udev rule is added.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: pubspec.yaml
          cache: true
      - run: flutter pub get

      # Booting a fresh emulator takes minutes; the snapshot is cached so
      # later runs start from a ready device.
      - name: Cache AVD
        uses: actions/cache@v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-${{ env.API_LEVEL }}-${{ env.TARGET }}-${{ env.ARCH }}-${{ env.PROFILE }}

      - name: Create AVD snapshot
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ env.API_LEVEL }}
          target: ${{ env.TARGET }}
          arch: ${{ env.ARCH }}
          profile: ${{ env.PROFILE }}
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: echo "Generated AVD snapshot."

      - name: Run integration tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ env.API_LEVEL }}
          target: ${{ env.TARGET }}
          arch: ${{ env.ARCH }}
          profile: ${{ env.PROFILE }}
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          # Each line runs as a separate shell command. logcat runs in the
          # background so the log is kept even when the test fails.
          script: |
            mkdir -p build/logs
            adb logcat -c
            adb logcat > build/logs/logcat.txt 2>&1 &
            flutter drive --driver=test_driver/integration_test.dart --target=integration_test/app_test.dart

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: emulator-screenshots
          path: build/screenshots/
          retention-days: 14
          if-no-files-found: warn

      - name: Upload logcat
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: emulator-logcat
          path: build/logs/
          retention-days: 14
          if-no-files-found: warn
