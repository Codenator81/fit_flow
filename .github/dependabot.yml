version: 2
updates:
  - package-ecosystem: pub
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  # Python packages for the documentation site (docs/requirements.txt).
  - package-ecosystem: pip
    directory: /docs
    schedule:
      interval: weekly
